# ==============================================================================
# workflow.ai.yml - the AI workflow for apsw-gridwright
#
# The single source for the rules every agent in this repository follows: Claude Code, Antigravity,
# Gemini and anything else. No agent toolchain loads this file by itself, so what it says reaches
# agents through generated files, and what it claims is checked by scripts:
#
#   AGENTS.md cycle block, GEMINI.md   generated by scripts/sync-agent-docs.mjs
#   .claude/skills/                    generated by scripts/sync-claude-skills.mjs
#   every claim below about the repo   checked by scripts/check-workflow.mjs
#
# Everything here is one of two kinds, and the file does not blur them:
#
#   enforced   a hook, CI job, lint rule, test or script fails when it is broken. `quality_gates`,
#              `ci`, `project`, `spec_kit`, the skill registry, and each rule's `enforced_by`.
#   guidance   what an agent is expected to do, with nothing that fails when it does not. `tracks`,
#              `stages` and `rules` whose `enforced_by` says "review". The procedure is in the file
#              each stage's `guidance` names.
#
# Do not add a setting that reads as configuration but that nothing reads. If a step matters enough
# to state as a setting, give it a check; otherwise write it as guidance.
#
# Edit this file, run the sync scripts, never the other way around.
# ==============================================================================

version: "2.0"
name: apsw-gridwright
description: "React data grid built on a headless engine. One pipeline serves local arrays and remote endpoints, negotiated through data-source capabilities."

# ------------------------------------------------------------------------------
# 0. Governance & Precedence
# ------------------------------------------------------------------------------
governance:
  authority: "This file is the supreme instruction source for every agent working in this repository. Where any other document disagrees with it, this file wins, and the other document is a defect to be fixed rather than a rule to be followed."
  precedence:
    - "workflow.ai.yml (this file) - supreme. Tracks, stages, the skill registry, quality gates and architectural rules are defined here and nowhere else."
    - ".agents/rules/** and .agents/skills/** - binding detail. They elaborate this file and may not contradict it."
    - ".agents/workflows/** - the procedures behind each stage and track. Guidance, not settings."
    - "AGENTS.md - loaded automatically by AGENTS.md-aware agents. Its cycle section is generated from this file; never hand-edit the generated block."
    - "GEMINI.md - Antigravity merges it with AGENTS.md and lets it win on conflict, so it is generated to carry no rule of its own. Never put a rule here; it would silently outrank the block generated from this file."
    - "CLAUDE.md - Claude Code entry point. Imports AGENTS.md and may add tool-specific notes, never overrides."
    - "specs/<feature-name>/** - binding for one feature only, subordinate to everything above."
  conflict_resolution: "Stop. Correct the subordinate document, re-run the sync scripts, then continue. Never settle a conflict by following the subordinate text."
  sync_commands:
    - "node scripts/sync-agent-docs.mjs"
    - "node scripts/sync-claude-skills.mjs"

# ------------------------------------------------------------------------------
# 1. Facts about the repository (enforced: scripts/check-workflow.mjs)
# ------------------------------------------------------------------------------
# Compared with package.json on every commit, so a toolchain upgrade that forgets this file fails
# instead of leaving agents a stale description of the project.
project:
  architecture: "Headless core (src/core, src/data, src/plugins, src/tree, src/i18n, src/locales) with one adapter (src/react). The core is DOM-free and React-free, enforced by lint."
  distribution: "Public npm package, MIT licensed, semver. Unpublished until the maintainer publishes it."
  runtime:
    node: ">=22.12"
  peer_dependencies:
    react: "^18.0.0 || ^19.0.0"
    react-dom: "^18.0.0 || ^19.0.0"
  toolchain:
    typescript: 5
    tsup: 8
    vitest: 5
    vite: 8
    eslint: 9

# ------------------------------------------------------------------------------
# 2. Tracks: which stages a change goes through (guidance)
# ------------------------------------------------------------------------------
# Pick the track before starting. When the work turns out bigger than its track, move up to the
# larger track and do the stages it adds; never move down to skip them.
tracks:
  - id: feature
    when: "Anything a consumer would notice: a new or changed export, prop, column field, add-on, option, default, event or rendered markup."
    stages: [specify, clarify, plan, tasks, analyze, implement, verify, review_ship]
    deliverables:
      - "a specs/<feature-name>/ directory satisfying spec_kit"
      - "CHANGELOG.md entry under Unreleased with the semver classification"
      - "docs/api.md, README.md and examples/ updated where the surface appears"
  - id: fix
    when: "Restores behaviour that is already documented or specified. No new surface. A fix that has to change a public type or a default is a feature."
    stages: [implement, verify, review_ship]
    deliverables:
      - "a test that fails before the fix and passes after it"
      - "CHANGELOG.md entry under Unreleased, in Fixed"
      - "if a public type still changes, its classification in the owning spec's api-surface.md"
  - id: chore
    when: "Documentation, agent instructions, tests, CI, tooling or dev dependencies, with nothing a consumer installs changing."
    stages: [verify, review_ship]
    deliverables:
      - "CHANGELOG.md entry only when it reaches a consumer: the Node floor, a peer range, the tarball"
  - id: release
    when: "Cutting a version: moving Unreleased under a number, bumping the version, tagging."
    stages: [verify, review_ship]
    guidance: ".agents/workflows/release.md"
    deliverables:
      - "CHANGELOG.md section for the version, package.json, package-lock.json and VERSION in src/index.ts in agreement"
      - "a v<version> tag on the merge commit on main. Pushing it runs .github/workflows/release.yml, which publishes to npm through the trusted publisher configured on npmjs.com: a pushed tag is a publish decision, and it is the maintainer's"

# ------------------------------------------------------------------------------
# 3. Stages (guidance; procedure in .agents/workflows/spec_driven_development.md)
# ------------------------------------------------------------------------------
stages:
  - id: specify
    phase: 1
    name: "Specify"
    lead_skills: [architect, documentation, accessibility]
    deliverables: ["specs/<feature-name>/spec.md"]
    guidance: ".agents/workflows/spec_driven_development.md"
    description: "The consumer problem, the stories of the developer who installs this package and of the person using the grid, acceptance criteria, non-goals, and which plugin and add-on deliver it."

  - id: clarify
    phase: 2
    name: "Clarify"
    lead_skills: [architect, api_surface, documentation]
    deliverables: ["specs/<feature-name>/spec.md (clarifications)"]
    guidance: ".agents/workflows/spec_driven_development.md"
    description: "Resolves naming, defaults, and which side of the local/remote seam a behaviour sits on. Every default chosen here is a decision a consumer inherits."

  - id: plan
    phase: 3
    name: "Plan"
    lead_skills: [architect, api_surface, data_source, performance, documentation]
    deliverables:
      - "specs/<feature-name>/api-surface.md"
      - "specs/<feature-name>/plan.md, data-model.md, research.md, events.md where the feature has one (see spec_kit)"
    guidance: ".agents/workflows/spec_driven_development.md"
    description: "Designs the engine change, the state shape, and the exact exported names, signatures and semver classification. api-surface.md is the contract implementation is written against."

  - id: tasks
    phase: 4
    name: "Tasks"
    lead_skills: [architect, refactor, documentation]
    deliverables: ["specs/<feature-name>/tasks.md, where the work has more than one step worth tracking"]
    guidance: ".agents/workflows/spec_driven_development.md"
    description: "An ordered checklist of testable tasks: core first, adapter second, documentation last."

  - id: analyze
    phase: 5
    name: "Analyze"
    lead_skills: [api_surface, application_security, security_guard, performance, accessibility]
    deliverables: []
    guidance: ".agents/workflows/spec_driven_development.md"
    description: "Audits the plan before code: breaking changes without a major, DOM or React in the core, new runtime dependencies, exploit-prone designs, accessibility regressions, per-row work in the hot path. A failure returns to Plan."

  - id: implement
    phase: 6
    name: "Implement"
    lead_skills: [architect, react_adapter, extensibility, styling, application_security]
    deliverables: []
    guidance: ".agents/rules/agent_orchestration.md"
    description: "Writes the change against api-surface.md. It may be split between a core agent and an adapter agent when the contract is precise enough; an agent that finds the contract wrong stops and reports rather than editing it."

  - id: verify
    phase: 7
    name: "Verify"
    lead_skills: [qa, smoke_tests, accessibility, debugger]
    deliverables: []
    guidance: ".agents/workflows/verification.md"
    description: "Runs npm run verify end to end and reports its actual output, then the manual checks no gate can make. A failing gate is investigated from its own output; after three failed attempts the plan is wrong, not the code."

  - id: review_ship
    phase: 8
    name: "Review and ship"
    lead_skills: [documentation, release, application_security, security_guard, api_surface]
    deliverables:
      - "specs/<feature-name>/review.md (feature track), or the review answers in the pull request"
      - "AGENTS.md, README.md, CHANGELOG.md, specs/DEPENDENCY_MAP.md and docs/api.md where they changed"
    guidance: ".agents/rules/review.md"
    description: "The 7-dimension self-review, documentation synchronised with the change, and a pull request whose required CI checks are green before it merges."

# ------------------------------------------------------------------------------
# 4. Spec directories (enforced: scripts/check-workflow.mjs)
# ------------------------------------------------------------------------------
# A small feature does not have a lifecycle contract or a data model, and making it write one
# produces padding. Every feature writes the required files. An optional file is either present or
# named under the omission heading in spec.md with the reason it does not apply.
spec_kit:
  directory: "specs"
  template: "specs/_template"
  required: [spec.md, api-surface.md, review.md]
  optional: [plan.md, tasks.md, data-model.md, research.md, events.md]
  omission_heading: "## Artifacts not written"

# ------------------------------------------------------------------------------
# 5. Skills (enforced: the registry must match .agents/skills/)
# ------------------------------------------------------------------------------
skills:
  directory: ".agents/skills"
  validator: "scripts/validate-skills.mjs"
  # Canonical text lives in .agents/skills. Claude Code discovers skills only under .claude/skills,
  # so scripts/sync-claude-skills.mjs mirrors each one there as a pointer (underscores become
  # hyphens). Pointers, never copies: one text, two toolchains.
  claude_code_mirror:
    directory: ".claude/skills"
    generator: "scripts/sync-claude-skills.mjs"
    check: "node scripts/sync-claude-skills.mjs --check"
  registry:
    # Architecture & public contract
    - name: architect
      role: "Core Engine Architect"
      path: ".agents/skills/architect/SKILL.md"
      scope: "The headless boundary, the engine state machine, and deciding whether a feature is a plugin, an add-on, a core service or a combination"
    - name: api_surface
      role: "Public API & Semver Steward"
      path: ".agents/skills/api_surface/SKILL.md"
      scope: "Exported names and signatures, breaking-change classification, export map and type entry points"
    - name: data_source
      role: "Data Source & Capability Negotiation Specialist"
      path: ".agents/skills/data_source/SKILL.md"
      scope: "The DataSource contract, capability declaration, remote pagination, totals, aborts and retries"
    - name: extensibility
      role: "Plugin & Add-on Author"
      path: ".agents/skills/extensibility/SKILL.md"
      scope: "Writing engine plugins, pipeline stages and React add-ons: stage order, teardown, slots, suppression, keeping third-party reach equal to the built-ins"

    # Frontend adapter
    - name: react_adapter
      role: "React Adapter Specialist"
      path: ".agents/skills/react_adapter/SKILL.md"
      scope: "Component composition, useSyncExternalStore, Strict Mode, render-count discipline, cell renderers"
    - name: styling
      role: "Unstyled Design System & i18n Specialist"
      path: ".agents/skills/styling/SKILL.md"
      scope: "CSS custom properties, class name overrides, dark mode, reduced motion, every visible string in labels"
    - name: accessibility
      role: "Accessible Grid Specialist"
      path: ".agents/skills/accessibility/SKILL.md"
      scope: "The ARIA grid pattern, aria-sort, live regions, keyboard reachability, focus after a page change"

    # Quality
    - name: qa
      role: "Test Suite Specialist"
      path: ".agents/skills/qa/SKILL.md"
      scope: "Vitest and Testing Library, what to assert, async grid tests without arbitrary timers"
    - name: smoke_tests
      role: "Built-Artifact Verification Specialist"
      path: ".agents/skills/smoke_tests/SKILL.md"
      scope: "The dist-level smoke suite and the packaging audit: export map, dual module output, shared chunk identity"
    - name: performance
      role: "Performance & Allocation Specialist"
      path: ".agents/skills/performance/SKILL.md"
      scope: "Per-row work, pipeline allocation, render counts, large data sets, measuring before changing"
    - name: debugger
      role: "Systematic Debugging Specialist"
      path: ".agents/skills/debugger/SKILL.md"
      scope: "Reading the actual failure output, isolating engine from adapter, reproducing a report as a test first"

    # Craft & delivery
    - name: refactor
      role: "Refactoring & Technical Debt Specialist"
      path: ".agents/skills/refactor/SKILL.md"
      scope: "Behaviour-preserving change, splitting an overgrown module, deprecating an export without breaking it"
    - name: documentation
      role: "Spec & Documentation Architect"
      path: ".agents/skills/documentation/SKILL.md"
      scope: "Spec directories and which artifacts a feature needs, README, CHANGELOG, DEPENDENCY_MAP, docs/api.md, comments that explain why"
    - name: release
      role: "Release & npm Publishing Specialist"
      path: ".agents/skills/release/SKILL.md"
      scope: "Version selection, CHANGELOG entries, tags and the publish workflow they start, what a published tarball contains"
    - name: security_guard
      role: "Supply Chain & Publish Safety Specialist"
      path: ".agents/skills/security_guard/SKILL.md"
      scope: "Runtime dependency policy, install scripts, the lockfile and .npmrc, what must never enter the tarball"
    - name: application_security
      role: "Application Security Guardian"
      path: ".agents/skills/application_security/SKILL.md"
      scope: "Exploit classes a grid has: HTML and script sinks, injection into files, URLs, selectors and styles, sandboxed documents, prototype pollution, ReDoS, what add-ons may reach, the development server. Banned APIs, no exceptions"

# ------------------------------------------------------------------------------
# 6. Gates (enforced)
# ------------------------------------------------------------------------------
quality_gates:
  # `.git/hooks` is not versioned, so the hook lives in `.githooks/` and `core.hooksPath` points at
  # it. check-workflow.mjs fails when a gate listed here is missing from the hook or from CI.
  local_hook:
    path: ".githooks/pre-commit"
    install: "node scripts/install-hooks.mjs"
  pre_commit:
    - name: "Skills Syntax & Security Validation"
      command: "node scripts/validate-skills.mjs"
    - name: "Claude Code Skill Pointer Sync"
      command: "node scripts/sync-claude-skills.mjs --check"
    - name: "Operating Cycle Mirrored Into AGENTS.md"
      command: "node scripts/sync-agent-docs.mjs --check"
    - name: "Workflow Claims Match the Repository"
      command: "node scripts/check-workflow.mjs"
    - name: "Security Audit (banned APIs, sandboxing, supply chain)"
      command: "node scripts/security-audit.mjs --source"
    - name: "TypeScript Type-Check"
      command: "npm run typecheck"
    - name: "ESLint"
      command: "npm run lint"
    - name: "Unit & React Test Suites"
      command: "npm test"

# The checks a pull request needs before it can merge into main. check-workflow.mjs compares this
# list with the job names in the CI file on every commit. Branch protection lives in GitHub, where
# a commit cannot see it: `node scripts/check-workflow.mjs --remote` compares it too, and the
# release workflow requires running that before tagging.
ci:
  workflow: ".github/workflows/ci.yml"
  protected_branch: main
  required_checks:
    - "Agent instruction set"
    - "Dependency audit"
    - "Verify on Node 22"
    - "Verify on Node 24"
    - "Example playground boots"
    - "Publishable tarball"

# ------------------------------------------------------------------------------
# 7. Architectural rules
# ------------------------------------------------------------------------------
# `enforced_by` names what fails when the rule is broken, or says "review" when nothing does. File
# paths in it are checked to exist. A rule whose enforcement is "review" is exactly as strong as the
# review, so the pull request template asks about each one.
architectural_rules:
  - rule: "Security is a blocking gate with no exceptions. Exploit-prone APIs are banned everywhere in the repository, the playground and scripts included: HTML sinks (dangerouslySetInnerHTML, innerHTML, outerHTML, insertAdjacentHTML, document.write), script sinks (eval, new Function, string timers), unsandboxed or script-enabled iframe documents, target=_blank without noopener, postMessage to '*', prototype writes from data, and inline disabling of a security lint rule. Every generated file and document escapes at the boundary, every URL, selector and style built from data is encoded, and no extension point may give third-party code a sink the package itself does not have. A change that needs an exception needs a different design."
    enforced_by: "`scripts/security-audit.mjs` (hook, verify, CI) and `eslint.config.js`"
  - rule: "The core is headless. Nothing under src/core, src/data, src/plugins, src/tree, src/i18n or src/locales may reference document, window, or React. A change that needs an exception is a change that belongs in an adapter."
    enforced_by: "`eslint.config.js` (no-restricted-globals, no-restricted-imports)"
  - rule: "Every feature is an engine plugin, a React add-on, or both. <Gridwright /> is a shell that imports no feature, and a built-in plugin or add-on has no access a third-party one lacks: when a feature needs a seam that does not exist, the seam is added to the public contract for everyone. Only state or an operation every renderer needs, with nothing about it a choice, is a core service on GridApi, and its UI is still an add-on."
    enforced_by: "`tests/react/third-party-addon.test.tsx` (a public-exports add-on reaches every slot) and `tests/smoke/tree-shaking.test.ts` (the shell carries no feature code)"
  - rule: "Zero runtime dependencies. The package declares peer dependencies on React only, both optional. A new entry under `dependencies` requires an explicit decision recorded in the spec, because every one of them is a version this package can force onto a consumer's tree."
    enforced_by: "`scripts/check-exports.mjs` and `scripts/security-audit.mjs` (manifest)"
  - rule: "Local and remote data travel one code path. A data source declares what it resolves through `capabilities`; the pipeline applies whatever is left. No feature may branch on where the rows came from."
    enforced_by: "review (.agents/rules/review.md, dimension 2)"
  - rule: "Rendering belongs to the adapter. ColumnDef carries no ReactNode; renderers live in GridwrightColumn under src/react."
    enforced_by: "`eslint.config.js` (react may not be imported under the core)"
  - rule: "Every visible string is in the labels object or an add-on's messages. A string literal rendered from JSX cannot be translated, and this package is used in applications that are."
    enforced_by: "review (.agents/rules/review.md, dimension 4); `auditAddonMessages` catches a missing key, not a literal"
  - rule: "Public API changes are classified before they are written. Adding an optional field is a minor; changing a signature, a default, or an emitted event's payload is a major. Record the classification in the spec and in CHANGELOG.md."
    enforced_by: "review (.agents/rules/review.md, dimension 3)"
  - rule: "A stage or plugin that throws loses its own effect and nothing else. Third-party code runs in the pipeline by design, and a broken plugin must not empty the grid."
    enforced_by: "`tests/unit/extensibility.test.ts`"
  - rule: "Every feature directory under specs/ contains spec.md, api-surface.md and review.md. Each of plan.md, tasks.md, data-model.md, research.md and events.md is either written or named in spec.md under Artifacts not written, with the reason it does not apply."
    enforced_by: "`scripts/check-workflow.mjs`"
  - rule: "A green unit suite is not evidence that the package works. It imports src/. The smoke suite imports dist/ through the export map, and no change ships without it passing."
    enforced_by: "CI (Verify on Node 22 and 24) and `prepublishOnly`"
  - rule: "Repository documentation moves with the change: AGENTS.md, README.md, CHANGELOG.md and specs/DEPENDENCY_MAP.md whenever the public surface, the architecture or the release contents change, and docs/api.md in the same change as any added, removed or changed prop, column field, add-on option or default."
    enforced_by: "review (.github/PULL_REQUEST_TEMPLATE.md)"
  - rule: "Accessibility is a gate, not a nicety: the header sort control is a real button, sort state is announced through aria-sort, and row changes reach a live region. A grid nobody can operate by keyboard is a broken grid."
    enforced_by: "`tests/react/accessible-state.test.tsx` and `tests/react/gridwright.test.tsx`; keyboard walk-through in `.agents/workflows/verification.md`"
  - rule: "No AI slop in the rendered output: no decorative sparkles, no placeholder charts, no invented totals. When a paginating source sends no total, the grid says so rather than displaying a number it computed from one page."
    enforced_by: "`tests/unit/engine-remote.test.ts` (totals); review for the rest"
