<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1176 1092" width="1176" height="1092" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">What Gridwright includes</title>
  <desc id="d">Data: Local array, REST endpoint, Remote fetcher, Windowed source, capabilities. Core, on by default: sorting, selection, pagination, staleNotice. Finding rows: search, columnFilters, urlSync. Working with rows: rowActions, inlineEditing, rowDetail, cellNavigation. Shape and scale: treeData, grouping, virtualRows, columnLayout. Any screen: responsive, touch devices. Getting data out: exportMenu. MUI, apsw-gridwright-mui: muiAddons, theme from createTheme, dark mode and CSS variables, TableSortLabel, Checkbox, TablePagination. Built in everywhere: ARIA grid and treegrid, live region, en de es fr pl, CSS custom properties, dark mode, TypeScript, ESM and CJS, zero dependencies.</desc>
  <style>
    :root { --box: #f6f8fa; --edge: #d0d7de; --ink: #1f2328; --soft: #59636e; --accent: #0969da; }
    @media (prefers-color-scheme: dark) { :root { --box: #161b22; --edge: #30363d; --ink: #e6edf3; --soft: #9198a1; --accent: #58a6ff; } }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.5; }
    .root { fill: var(--box); stroke: var(--accent); stroke-width: 2.5; }
    .h { fill: var(--accent); font-size: 17px; font-weight: 700; }
    .p { fill: var(--ink); font-size: 14px; font-weight: 600; }
    .s { fill: var(--soft); font-size: 13px; }
    .r { fill: var(--ink); font-size: 26px; font-weight: 700; }
  </style>
  <rect class="root" x="458" y="22" width="260" height="60" rx="30"/>
  <text class="r" x="588" y="62" text-anchor="middle">Gridwright</text>
  <rect class="box" x="24" y="110" width="360" height="358" rx="10"/><text class="h" x="42" y="140">Data</text><text class="p" x="42" y="170">Local array</text><text class="p" x="42" y="191">REST endpoint</text><text class="s" x="60" y="212">· buildParams</text><text class="s" x="60" y="233">· parseResponse</text><text class="p" x="42" y="254">Remote fetcher</text><text class="s" x="60" y="275">· retry and backoff</text><text class="s" x="60" y="296">· abort stale requests</text><text class="p" x="42" y="317">Windowed source</text><text class="s" x="60" y="338">· ten million rows</text><text class="p" x="42" y="359">capabilities</text><text class="s" x="60" y="380">· sort</text><text class="s" x="60" y="401">· filter</text><text class="s" x="60" y="422">· search</text><text class="s" x="60" y="443">· paginate</text>
  <rect class="box" x="24" y="492" width="360" height="232" rx="10"/><text class="h" x="42" y="522">Any screen</text><text class="p" x="42" y="552">responsive</text><text class="s" x="60" y="573">· hideBelow</text><text class="s" x="60" y="594">· stackBelow</text><text class="s" x="60" y="615">· whenNarrow</text><text class="s" x="60" y="636">· useContainerWidth</text><text class="p" x="42" y="657">touch devices</text><text class="s" x="60" y="678">· three-dot row menu</text><text class="s" x="60" y="699">· 44 px targets</text>
  <rect class="box" x="24" y="748" width="360" height="148" rx="10"/><text class="h" x="42" y="778">MUI, apsw-gridwright-mui</text><text class="p" x="42" y="808">muiAddons</text><text class="p" x="42" y="829">theme from createTheme</text><text class="p" x="42" y="850">dark mode and CSS variables</text><text class="p" x="42" y="871">TableSortLabel, Checkbox, TablePagination</text>
  <rect class="box" x="408" y="110" width="360" height="316" rx="10"/><text class="h" x="426" y="140">Core, on by default</text><text class="p" x="426" y="170">sorting</text><text class="s" x="444" y="191">· multiSort</text><text class="s" x="444" y="212">· priority badges</text><text class="p" x="426" y="233">selection</text><text class="s" x="444" y="254">· single or multiple</text><text class="s" x="444" y="275">· checkboxes</text><text class="s" x="444" y="296">· selectAll</text><text class="s" x="444" y="317">· selectOnRowClick</text><text class="p" x="426" y="338">pagination</text><text class="s" x="444" y="359">· pageSizeOptions</text><text class="s" x="444" y="380">· honest totals</text><text class="p" x="426" y="401">staleNotice</text>
  <rect class="box" x="408" y="450" width="360" height="442" rx="10"/><text class="h" x="426" y="480">Shape and scale</text><text class="p" x="426" y="510">treeData</text><text class="s" x="444" y="531">· loadChildren</text><text class="s" x="444" y="552">· defaultExpandedDepth</text><text class="s" x="444" y="573">· keepAncestorsOfMatches</text><text class="p" x="426" y="594">grouping</text><text class="s" x="444" y="615">· groupBy</text><text class="s" x="444" y="636">· aggregate</text><text class="s" x="444" y="657">· summaryRow</text><text class="p" x="426" y="678">virtualRows</text><text class="s" x="444" y="699">· rowHeight</text><text class="s" x="444" y="720">· overscan</text><text class="s" x="444" y="741">· renderSkeleton</text><text class="p" x="426" y="762">columnLayout</text><text class="s" x="444" y="783">· resizable</text><text class="s" x="444" y="804">· reorderable</text><text class="s" x="444" y="825">· pinning</text><text class="s" x="444" y="846">· picker</text><text class="s" x="444" y="867">· canChange</text>
  <rect class="box" x="792" y="110" width="360" height="190" rx="10"/><text class="h" x="810" y="140">Finding rows</text><text class="p" x="810" y="170">search</text><text class="p" x="810" y="191">columnFilters</text><text class="p" x="810" y="212">urlSync</text><text class="s" x="828" y="233">· facets</text><text class="s" x="828" y="254">· push</text><text class="s" x="828" y="275">· prefix</text>
  <rect class="box" x="792" y="324" width="360" height="295" rx="10"/><text class="h" x="810" y="354">Working with rows</text><text class="p" x="810" y="384">rowActions</text><text class="s" x="828" y="405">· hover, click, right-click</text><text class="s" x="828" y="426">· placement</text><text class="p" x="810" y="447">inlineEditing</text><text class="s" x="828" y="468">· commit</text><text class="p" x="810" y="489">rowDetail</text><text class="s" x="828" y="510">· single</text><text class="s" x="828" y="531">· persistAcrossPages</text><text class="p" x="810" y="552">cellNavigation</text><text class="s" x="828" y="573">· arrow keys</text><text class="s" x="828" y="594">· copy to clipboard</text>
  <rect class="box" x="792" y="643" width="360" height="190" rx="10"/><text class="h" x="810" y="673">Getting data out</text><text class="p" x="810" y="703">exportMenu</text><text class="s" x="828" y="724">· CSV</text><text class="s" x="828" y="745">· Excel</text><text class="s" x="828" y="766">· Markdown</text><text class="s" x="828" y="787">· print and PDF</text><text class="s" x="828" y="808">· report templates</text>
  <rect class="box" x="792" y="857" width="360" height="211" rx="10"/><text class="h" x="810" y="887">Built in everywhere</text><text class="p" x="810" y="917">ARIA grid and treegrid</text><text class="p" x="810" y="938">live region</text><text class="p" x="810" y="959">en de es fr pl</text><text class="p" x="810" y="980">CSS custom properties</text><text class="p" x="810" y="1001">dark mode</text><text class="p" x="810" y="1022">TypeScript, ESM and CJS</text><text class="p" x="810" y="1043">zero dependencies</text>
</svg>
