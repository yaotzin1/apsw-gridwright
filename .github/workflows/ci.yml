name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The instruction set has to stay consistent whether or not anything else builds, and these
  # need nothing installed, so they run first and fail fast.
  instructions:
    name: Agent instruction set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skills
        run: node scripts/validate-skills.mjs

      - name: Claude Code skill pointers are in sync
        run: node scripts/sync-claude-skills.mjs --check

      - name: AGENTS.md and GEMINI.md match workflow.ai.yml
        run: node scripts/sync-agent-docs.mjs --check

      # The toolchain, the job names, the gates and the spec directories the workflow file describes.
      - name: workflow.ai.yml matches the repository
        run: node scripts/check-workflow.mjs

      # Banned APIs, sandboxing and the manifest. Pure Node, so it runs before anything installs.
      - name: Security audit (source and manifest)
        run: node scripts/security-audit.mjs --source

  # Known vulnerabilities in anything the lockfile installs, dev tooling included: it runs on every
  # contributor's machine and in this pipeline. Blocking at any severity. A new advisory failing an
  # unrelated pull request is the point, not a nuisance: the fix is an upgrade, not a waiver.
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        run: npm audit --audit-level=low

  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported runtime the package declares in engines, oldest first. A declaration
        # nothing tests is a guess. 22.12 is the floor of the patched test toolchain.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and React suites
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke suite against the built package
        run: npx vitest run --config vitest.smoke.config.ts

      - name: Packaging audit
        run: npm run check:exports

      - name: Security audit (built bundles and source maps)
        run: npm run security:audit

  # The playground is how a change is checked by hand, so it has to keep working. Nothing here
  # tests the library; it tests that the page still loads the built files and the mock API still
  # answers, which is what silently rots after a build config change.
  example:
    name: Example playground boots
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # The quickstart is a real Vite app, so typecheck and lint cover its code but not whether it
      # still resolves and builds. Its aliases point the package specifiers at `src/`, and a build
      # config change is exactly what breaks them without any suite noticing.
      - name: The React quickstart still builds
        run: npx vite build --config examples/react-quickstart/vite.config.ts --outDir "$RUNNER_TEMP/quickstart" --emptyOutDir

      - name: Boot the server and request every page
        run: |
          node scripts/serve-example.mjs &
          SERVER=$!
          trap 'kill $SERVER' EXIT

          for attempt in $(seq 1 20); do
            curl -sf http://127.0.0.1:5173/ >/dev/null && break
            sleep 0.5
          done

          curl -sf http://127.0.0.1:5173/ > /tmp/index.html
          curl -sf http://127.0.0.1:5173/examples/playground/tree.html > /dev/null
          curl -sf http://127.0.0.1:5173/dist/index.js > /dev/null
          curl -sf http://127.0.0.1:5173/dist/react/index.js > /dev/null
          curl -sf http://127.0.0.1:5173/dist/styles.css > /dev/null

          grep -q 'apsw-gridwright playground' /tmp/index.html

          # Every module each page asks for, because a page whose script 404s still serves a
          # perfectly good empty page and every check above it passes. That is not hypothetical:
          # a relative script path resolved against `/` produced exactly that. A path without a
          # leading slash is relative to the page's directory.
          : > /tmp/modules.txt
          for page in /examples/playground/index.html /examples/playground/tree.html; do
            curl -sf "http://127.0.0.1:5173$page" \
              | grep -o 'src="[^"]*\.js"' | sed 's/src="//; s/"//' \
              | sed 's#^\([^/]\)#/examples/playground/\1#' >> /tmp/modules.txt
          done

          # And every module those import, which the HTML never names: the pages are split into a
          # folder of modules each, and one missing file blanks the whole page.
          find examples/playground/js -name '*.js' | sed 's#^#/#' >> /tmp/modules.txt
          echo /examples/playground/playground.css >> /tmp/modules.txt

          for module in $(sort -u /tmp/modules.txt); do
            echo "  module $module"
            curl -sf "http://127.0.0.1:5173$module" > /dev/null
          done

          # The report service the playground's server-rendered export posts to.
          curl -sf -X POST -H 'Content-Type: text/markdown' --data '# Report' http://127.0.0.1:5173/api/reports \
            | grep -q '<h1>Report</h1>'

          # The server serves dist/ and examples/ only, and refuses traversal, including into a sibling
          # directory whose name starts with the repository's.
          for forbidden in /package.json /.git/config /src/index.ts /examples/../package.json /dist/../../etc/hosts; do
            STATUS=$(curl -s --path-as-is -o /dev/null -w '%{http_code}' "http://127.0.0.1:5173$forbidden")
            if [ "$STATUS" != "403" ] && [ "$STATUS" != "404" ]; then
              echo "The playground server answered $STATUS for $forbidden"; exit 1
            fi
          done

          # The stored tree, which the features page posts its changes to.
          curl -sf http://127.0.0.1:5173/api/files | node -e "
            let body = '';
            process.stdin.on('data', (chunk) => { body += chunk; });
            process.stdin.on('end', () => {
              const rows = JSON.parse(body).data;
              if (!Array.isArray(rows) || rows.length === 0) {
                console.error('The stored tree came back empty.');
                process.exit(1);
              }
            });
          "

          # The mock API must honour only the capabilities it was told about, or the page's whole
          # demonstration is a lie.
          SORTED=$(curl -sf 'http://127.0.0.1:5173/api/people?page=1&pageSize=1&sort=salary:desc&serverDoes=sort,paginate')
          UNSORTED=$(curl -sf 'http://127.0.0.1:5173/api/people?page=1&pageSize=1&sort=salary:desc&serverDoes=paginate')
          node -e "
            const sorted = JSON.parse(process.argv[1]).data[0];
            const unsorted = JSON.parse(process.argv[2]).data[0];
            if (sorted.salary <= unsorted.salary) {
              console.error('The mock API ignored serverDoes: it sorted when it was told not to.');
              process.exit(1);
            }
            console.log('mock API honours serverDoes');
          " "$SORTED" "$UNSORTED"

  # A green suite says nothing about what npm would actually publish.
  package:
    name: Publishable tarball
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: List what would be published
        run: npm pack --dry-run

      - name: Refuse a tarball containing sources, specs or tests
        run: |
          npm pack --json > /tmp/pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('/tmp/pack.json','utf8'))[0].files.map(f => f.path);
            const banned = files.filter(f => /^(src|tests|specs|[.]agents|[.]github)\//.test(f) || f.endsWith('.env'));
            if (banned.length) {
              console.error('These files would be published and must not be:', banned);
              process.exit(1);
            }
            console.log(files.length + ' files would be published, none of them sources or specs.');
          "
