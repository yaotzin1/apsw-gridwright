name: Release

# Publishing is close to irreversible: a version can be unpublished for 72 hours and never
# republished under the same number. This runs only on a pushed tag, so publishing is always a
# deliberate act with a commit behind it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing: npm exchanges this job's OIDC token (id-token: write, above) for a
      # short-lived publish credential, so no npm token is stored anywhere. It needs npm 11.5.1 or
      # newer, and Node 22 ships npm 10. The package's trusted publisher on npmjs.com must name this
      # repository, this workflow file and the npm-publish environment.
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: The tag must match the version in package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG."
            exit 1
          fi
          echo "Publishing $PKG."

      - name: Full verification gate
        run: npm run verify

      # Authenticated by trusted publishing. NPM_TOKEN is only a fallback for a registry without it,
      # and is empty when the secret does not exist.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
