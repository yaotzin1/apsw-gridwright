name: Release

# Publishing is close to irreversible: a version can be unpublished for 72 hours and never
# republished under the same number. This runs only on a pushed tag, so publishing is always a
# deliberate act with a commit behind it.
#
# Two packages, two tag prefixes: `v<version>` publishes apsw-gridwright (the repository root),
# `mui-v<version>` publishes apsw-gridwright-mui (packages/mui). Each package has its own trusted
# publisher on npmjs.com, naming this repository, this workflow file and the npm-publish environment.
on:
  push:
    tags:
      - 'v*'
      - 'mui-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing: npm exchanges this job's OIDC token (id-token: write, above) for a
      # short-lived publish credential, so no npm token is stored anywhere. It needs npm 11.5.1 or
      # newer, and Node 22 ships npm 10.
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci

      # Which package the tag publishes, written to the environment for the steps below.
      - name: The package this tag publishes
        run: |
          case "$GITHUB_REF_NAME" in
            mui-v*)
              echo "MANIFEST=packages/mui/package.json" >> "$GITHUB_ENV"
              echo "TAG_VERSION=${GITHUB_REF_NAME#mui-v}" >> "$GITHUB_ENV"
              echo "WORKSPACE=--workspace apsw-gridwright-mui" >> "$GITHUB_ENV"
              ;;
            v*)
              echo "MANIFEST=package.json" >> "$GITHUB_ENV"
              echo "TAG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
              echo "WORKSPACE=" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Tag $GITHUB_REF_NAME publishes nothing."
              exit 1
              ;;
          esac

      - name: The tag must match the version in the package's manifest
        run: |
          PKG=$(node -p "require('./$MANIFEST').version")
          NAME=$(node -p "require('./$MANIFEST').name")
          if [ "$TAG_VERSION" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match $MANIFEST version $PKG."
            exit 1
          fi
          echo "Publishing $NAME $PKG."

      # The MUI package's peer range on the grid must already be installable. Published first, it
      # would fail every consumer's install until the grid caught up.
      - name: The grid version apsw-gridwright-mui needs is on npm
        if: startsWith(github.ref_name, 'mui-v')
        run: |
          RANGE=$(node -p "require('./packages/mui/package.json').peerDependencies['apsw-gridwright']")
          # The exit status, not the output: with no match, `npm view --json` still prints (an error
          # object) and fails.
          if ! FOUND=$(npm view "apsw-gridwright@$RANGE" version --json 2>/dev/null) || [ -z "$FOUND" ] || [ "$FOUND" = "[]" ]; then
            echo "No published apsw-gridwright satisfies $RANGE. Release the grid first."
            exit 1
          fi
          echo "apsw-gridwright $RANGE is published: $FOUND"

      - name: Full verification gate
        run: npm run verify

      # Authenticated by trusted publishing. NPM_TOKEN is only a fallback for a registry without it,
      # and is empty when the secret does not exist.
      - name: Publish
        run: npm publish $WORKSPACE --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # A GitHub Release per published version, so the repository shows what shipped and watchers are
  # notified. It runs only after the npm publish succeeded, in a separate job so the publishing job
  # keeps read-only access to the repository. The notes are the version's section of the package's
  # changelog, the same text npm readers see.
  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from the changelog
        run: |
          case "$GITHUB_REF_NAME" in
            mui-v*) VERSION="${GITHUB_REF_NAME#mui-v}"; CHANGELOG=packages/mui/CHANGELOG.md; NAME=apsw-gridwright-mui ;;
            *)      VERSION="${GITHUB_REF_NAME#v}";     CHANGELOG=CHANGELOG.md;              NAME=apsw-gridwright ;;
          esac
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$CHANGELOG" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "$CHANGELOG has no section for $VERSION."
            exit 1
          fi
          echo "TITLE=$NAME $VERSION" >> "$GITHUB_ENV"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$TITLE" --notes-file release-notes.md
