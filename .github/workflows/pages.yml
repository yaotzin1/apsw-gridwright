name: Demo

# Publishes the demo to GitHub Pages: https://yaotzin1.github.io/apsw-gridwright/
#   /            the playground (every add-on, switchable), its API answered in the browser
#   /steps/      the six-step quickstart
# Both build from this repository, so there is no npm publish and no secret. Nothing here is a required check; a failed demo build never blocks a pull request.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy demo to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The playground imports the real build, so the package is built first.
      - run: npm run build
      - name: Assemble the playground (every add-on, over an in-browser mock API)
        run: node scripts/build-demo.mjs
        env:
          DEMO_BASE: /apsw-gridwright/
      - name: Build the step-by-step quickstart into /steps/
        run: npx vite build --config examples/react-quickstart/vite.config.ts --outDir ../../demo-dist/steps --emptyOutDir false
        env:
          DEMO_BASE: /apsw-gridwright/steps/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist
      - id: deployment
        uses: actions/deploy-pages@v4
