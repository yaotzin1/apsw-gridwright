name: Demo

# Publishes the react-quickstart example to GitHub Pages: https://yaotzin1.github.io/apsw-gridwright/
# It builds from source (the example aliases the package to src/), so it needs no npm publish and
# no secret. Nothing here is a required check; a failed demo build never blocks a pull request.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy demo to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the demo
        run: npx vite build --config examples/react-quickstart/vite.config.ts
        env:
          DEMO_BASE: /apsw-gridwright/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist
      - id: deployment
        uses: actions/deploy-pages@v4
